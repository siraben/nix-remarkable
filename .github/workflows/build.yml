name: nix-remarkable

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - attr: hostPkgs.gst-libvncclient-rfbsrc
            artifact: gst-libvncclient-rfbsrc
          - attr: rm1Pkgs.appmarkable
            artifact: rm1-appmarkable
          - attr: rm1Pkgs.chessmarkable
            artifact: rm1-chessmarkable
          - attr: rm1Pkgs.evkill
            artifact: rm1-evkill
          - attr: rm1Pkgs.remarkable-fractals
            artifact: rm1-remarkable-fractals
          - attr: rm1Pkgs.remarkable_news
            artifact: rm1-remarkable_news
          - attr: rm1Pkgs.retris
            artifact: rm1-retris
          - attr: rm1Pkgs.rm-video-player
            artifact: rm1-rm-video-player
          - attr: rm2Pkgs.appmarkable
            artifact: rm2-appmarkable
          - attr: rm2Pkgs.chessmarkable
            artifact: rm2-chessmarkable
          - attr: rm2Pkgs.evkill
            artifact: rm2-evkill
          - attr: rm2Pkgs.remarkable-fractals
            artifact: rm2-remarkable-fractals
          - attr: rm2Pkgs.remarkable_news
            artifact: rm2-remarkable_news
          - attr: rm2Pkgs.retris
            artifact: rm2-retris
          - attr: rm2Pkgs.rm-video-player
            artifact: rm2-rm-video-player

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_SIGNING_KEY != ''
        with:
          name: nix-remarkable
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build ${{ matrix.attr }}
        id: build
        run: |
          set -euo pipefail
          out="$(nix build --allow-import-from-derivation --print-out-paths -L ".#${{ matrix.attr }}")"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Copy ${{ matrix.attr }}
        run: |
          set -euo pipefail
          mkdir artifact
          cp -R "${{ steps.build.outputs.out }}/." artifact/
          chmod -R u+w artifact

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifact
